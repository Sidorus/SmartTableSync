name: Publish to NuGet

# Publishes SmartTableSync and SmartTableSync.Scaffold to nuget.org when a version tag is pushed,
# for example v0.5.0 or v0.5.0-preview.1. The tag is the version: nothing else needs changing.
# Signs in with NuGet trusted publishing (no API key); the nuget.org policy allows exactly this
# workflow file, in the "release" environment, for these two packages. See docs/releasing.md.
on:
  push:
    tags: ['v*']

# Never two publishes at once; a second tag waits for the first to finish
concurrency:
  group: publish-nuget
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewer, and only v* tags may use it (repository settings)
    environment: release
    permissions:
      id-token: write   # the short-lived token for nuget.org trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, to check the tag is on main

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't a version: use v1.2.3 or v1.2.3-preview.1"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      # Only reviewed code is released: the tagged commit must be part of main
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that isn't on main"
            exit 1
          fi

      - name: Restore
        run: dotnet restore SmartTableSync.slnx

      - name: Build
        run: dotnet build SmartTableSync.slnx --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test SmartTableSync.slnx --no-build --configuration Release

      - name: Pack
        run: |
          dotnet pack SmartTableSync.Core/SmartTableSync.Core.csproj --no-build --configuration Release --output artifacts -p:Version=${{ steps.version.outputs.version }}
          dotnet pack SmartTableSync.Scaffold/SmartTableSync.Scaffold.csproj --no-build --configuration Release --output artifacts -p:Version=${{ steps.version.outputs.version }}
          ls -l artifacts

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate: re-running the same tag doesn't fail on a version already published
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Keep the packages with the run
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg
