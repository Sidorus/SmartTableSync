name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SmartTableSync.slnx

      - name: Build
        run: dotnet build SmartTableSync.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SmartTableSync.Tests/SmartTableSync.Tests.csproj --no-build --configuration Release

      - name: Pack (sanity check — not published)
        run: dotnet pack SmartTableSync.Core/SmartTableSync.Core.csproj --no-build --configuration Release
