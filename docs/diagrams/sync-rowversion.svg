<svg xmlns="http://www.w3.org/2000/svg" width="680" height="790" viewBox="0 0 680 790" role="img" aria-labelledby="title desc">
  <title id="title">RowVersion strategy</title>
  <desc id="desc">SQL Server sets the rowversion column of dbo.Customer on every insert and update. A run reads from the position saved in the child (0x...07D4) and captures MIN_ACTIVE_ROWVERSION (0x...07DB) before reading. It reads rows with RowVer at or above the saved position, in key order: keys 2 and 4. It merges them into the child and saves 0x...07DB. Deleted key 3 leaves no row, so the hourly delete reconciliation removes it.</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --surface:#f6f8fa; --df:#eeedfe; --ds:#534ab7; --dt:#3c3489; --cf:#e1f5ee; --cs:#0f6e56; --ctx:#085041; --wr:#bc4c00; --rf:#faece7; --rs:#993c1d; --rt:#712b13; }
    @media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --surface:#151b23; --df:#2a2650; --ds:#afa9ec; --dt:#cecbf6; --cf:#0b3a30; --cs:#5dcaa5; --ctx:#9fe1cb; --wr:#f0883e; --rf:#3d1e12; --rs:#f0997b; --rt:#f5c4b3; } }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: var(--bg); }
    .box { fill: var(--surface); stroke: var(--line); }
    .data { fill: var(--df); stroke: var(--ds); }
    .ct { fill: var(--cf); stroke: var(--cs); }
    .del { fill: var(--rf); stroke: var(--rs); }
    .t { fill: var(--fg); font-size: 14px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 12px; }
    .dt { fill: var(--dt); font-size: 14px; font-weight: 600; }
    .ds { fill: var(--dt); font-size: 12px; }
    .ctt { fill: var(--ctx); font-size: 14px; font-weight: 600; }
    .cts { fill: var(--ctx); font-size: 12px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; }
    .rt { fill: var(--rt); font-size: 14px; font-weight: 600; }
    .rs { fill: var(--rt); font-size: 12px; }
    .arr { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .wr { stroke: var(--wr); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .wl { fill: var(--wr); font-size: 12px; font-weight: 600; }
    .rule { stroke: var(--cs); stroke-width: 0.5; }
    .mk { stroke: var(--muted); }
    .mkw { stroke: var(--wr); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mkw" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="790" rx="12"/>

  <rect class="box" x="240" y="30" width="200" height="50" rx="8"/>
  <text class="t" x="340" y="49" text-anchor="middle" dominant-baseline="central">Application</text>
  <text class="s" x="340" y="66" text-anchor="middle" dominant-baseline="central">INSERT · UPDATE · DELETE</text>
  <line class="wr" x1="340" y1="80" x2="340" y2="116" marker-end="url(#w)"/>
  <text class="wl" x="352" y="98" dominant-baseline="central">SQL Server sets RowVer on insert and update</text>

  <rect class="data" x="200" y="120" width="280" height="140" rx="10"/>
  <text class="dt" x="340" y="140" text-anchor="middle" dominant-baseline="central">dbo.Customer</text>
  <text class="ds" x="340" y="158" text-anchor="middle" dominant-baseline="central">Key · Name · RowVer</text>
  <text class="ds" x="340" y="184" text-anchor="middle" dominant-baseline="central">1 · Anna · 0x...07D1</text>
  <text class="ds" x="340" y="204" text-anchor="middle" dominant-baseline="central">2 · Erik L. · 0x...07D9</text>
  <text class="ds" x="340" y="224" text-anchor="middle" dominant-baseline="central">4 · Lars · 0x...07DA</text>
  <text class="ds" x="340" y="244" text-anchor="middle" dominant-baseline="central">key 3 deleted: nothing left to read</text>

  <rect class="box" x="40" y="300" width="260" height="60" rx="8"/>
  <text class="t" x="170" y="320" text-anchor="middle" dominant-baseline="central">From: saved position</text>
  <text class="s" x="170" y="340" text-anchor="middle" dominant-baseline="central">0x...07D4, stored in the child</text>

  <rect class="box" x="380" y="300" width="260" height="60" rx="8"/>
  <text class="t" x="510" y="320" text-anchor="middle" dominant-baseline="central">To: MIN_ACTIVE_ROWVERSION()</text>
  <text class="s" x="510" y="340" text-anchor="middle" dominant-baseline="central">0x...07DB, captured before reading</text>

  <line class="arr" x1="340" y1="260" x2="340" y2="406" marker-end="url(#a)"/>
  <line class="arr" x1="170" y1="360" x2="170" y2="406" marker-end="url(#a)"/>
  <line class="arr" x1="510" y1="360" x2="510" y2="406" marker-end="url(#a)"/>

  <rect class="ct" x="110" y="410" width="460" height="140" rx="10"/>
  <text class="ctt" x="340" y="430" text-anchor="middle" dominant-baseline="central">WHERE RowVer &gt;= 0x...07D4, page by page by key</text>
  <text class="ctt" x="200" y="458" text-anchor="middle" dominant-baseline="central">Key</text>
  <text class="ctt" x="330" y="458" text-anchor="middle" dominant-baseline="central">Name</text>
  <text class="ctt" x="470" y="458" text-anchor="middle" dominant-baseline="central">RowVer</text>
  <line class="rule" x1="130" y1="470" x2="550" y2="470"/>
  <text class="cts" x="200" y="490" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="cts" x="330" y="490" text-anchor="middle" dominant-baseline="central">Erik L.</text>
  <text class="cts" x="470" y="490" text-anchor="middle" dominant-baseline="central">0x...07D9</text>
  <text class="cts" x="200" y="512" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="cts" x="330" y="512" text-anchor="middle" dominant-baseline="central">Lars</text>
  <text class="cts" x="470" y="512" text-anchor="middle" dominant-baseline="central">0x...07DA</text>
  <text class="s" x="340" y="536" text-anchor="middle" dominant-baseline="central">1 is older than the saved position · 3 has no row</text>

  <line class="arr" x1="340" y1="550" x2="340" y2="586" marker-end="url(#a)"/>
  <rect class="data" x="150" y="590" width="380" height="60" rx="8"/>
  <text class="dt" x="340" y="610" text-anchor="middle" dominant-baseline="central">Child database</text>
  <text class="ds" x="340" y="630" text-anchor="middle" dominant-baseline="central">upsert 2, 4 · save 0x...07DB if the run succeeded</text>

  <line class="arr" x1="340" y1="650" x2="340" y2="686" marker-end="url(#a)"/>
  <rect class="del" x="150" y="690" width="380" height="60" rx="8"/>
  <text class="rt" x="340" y="710" text-anchor="middle" dominant-baseline="central">Delete reconciliation, hourly by default</text>
  <text class="rs" x="340" y="730" text-anchor="middle" dominant-baseline="central">parent keys vs child keys → delete 3</text>
</svg>
